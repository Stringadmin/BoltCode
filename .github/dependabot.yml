# Dependabot keeps dependencies current and flags known vulnerabilities.
# - Go modules: weekly checks for newer module versions
# - GitHub Actions: weekly checks for newer action versions (so we don't pin
#   stale @v4 actions forever)
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
