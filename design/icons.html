<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>BoltCode 图标设计</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #0f1117; color: #c0caf5; padding: 30px; }
  h1 { color: #7aa2f7; margin-bottom: 6px; }
  .sub { color: #565f89; font-size: 13px; margin-bottom: 28px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; max-width: 980px; }
  .card { background: #1a1b26; border-radius: 14px; padding: 20px; border: 1px solid #2a2e44; text-align: center; }
  .card h3 { color: #e0af68; font-size: 13px; margin-bottom: 4px; }
  .card .desc { color: #9aa5ce; font-size: 11px; margin-bottom: 14px; line-height: 1.5; min-height: 42px; }
  .icon-box { background: #0d1117; border-radius: 10px; padding: 24px; display: flex; align-items: center; justify-content: center; min-height: 130px; }
  .icon-box.light { background: #fff; }
  .actions { margin-top: 12px; }
  .btn { padding: 5px 10px; font-size: 11px; cursor: pointer; border: none; border-radius: 5px; background: #3b4261; color: #c0caf5; }
  .btn:hover { background: #4c5375; }
  .row { display:flex; gap:8px; justify-content:center; }
</style>
</head>
<body>
  <h1>BoltCode 图标设计</h1>
  <div class="sub">4 款纯图标，几何设计感，闪电 + 代码/AI 融合。点导出 SVG。</div>

  <div class="grid">

    <!-- 1: 闪电形本体 = 字母 B 的负空间 -->
    <div class="card">
      <h3>1. 负空间 B</h3>
      <div class="desc">方块圆角底，闪电劈出的负空间刚好构成 B 的轮廓。一眼双重意象。</div>
      <div class="icon-box light">
        <svg width="100" height="100" viewBox="0 0 100 100" id="ic1">
          <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7aa2f7"/><stop offset="1" stop-color="#bb9af7"/></linearGradient></defs>
          <rect x="8" y="8" width="84" height="84" rx="20" fill="url(#g1)"/>
          <!-- B formed by negative space via lightning cut -->
          <path d="M58 20 L35 50 L48 50 L42 70 L60 42 L49 42 L65 20 Z" fill="#0d1117"/>
          <rect x="30" y="20" width="6" height="50" rx="3" fill="#0d1117" opacity="0"/>
        </svg>
      </div>
      <div class="actions"><div class="row"><button class="btn" onclick="exportSvg('ic1','boltcode-icon-1')">导出 SVG</button></div></div>
    </div>

    <!-- 2: 闪电 + 尖括号融合 -->
    <div class="card">
      <h3>2. 闪电尖括号</h3>
      <div class="desc">闪电主干本身是 &lt; 形，尖端带 &gt;，合起来是代码括号里的闪电。极简锋利。</div>
      <div class="icon-box">
        <svg width="100" height="100" viewBox="0 0 100 100" id="ic2">
          <defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7dcfff"/><stop offset="1" stop-color="#7aa2f7"/></linearGradient></defs>
          <!-- < shape as lightning left edge -->
          <path d="M70 18 L30 50 L52 50 L42 82 L82 42 L58 42 Z" fill="url(#g2)"/>
          <!-- accent tip -->
          <circle cx="70" cy="18" r="5" fill="#e0af68"/>
        </svg>
      </div>
      <div class="actions"><div class="row"><button class="btn" onclick="exportSvg('ic2','boltcode-icon-2')">导出 SVG</button></div></div>
    </div>

    <!-- 3: 圆角方块 + 闪电 + 代码点阵 -->
    <div class="card">
      <h3>3. 闪电点阵</h3>
      <div class="desc">深色圆角方块，闪电居中，周围代码点阵（·）暗示编程。有科技质感。</div>
      <div class="icon-box light">
        <svg width="100" height="100" viewBox="0 0 100 100" id="ic3">
          <rect x="8" y="8" width="84" height="84" rx="22" fill="#1a1b26"/>
          <!-- code dots grid -->
          <g fill="#3b4261">
            <circle cx="25" cy="28" r="2.5"/><circle cx="38" cy="28" r="2.5"/><circle cx="75" cy="28" r="2.5"/>
            <circle cx="25" cy="72" r="2.5"/><circle cx="62" cy="72" r="2.5"/><circle cx="75" cy="72" r="2.5"/>
          </g>
          <!-- lightning -->
          <path d="M58 22 L40 52 L52 52 L46 78 L66 46 L54 46 Z" fill="#7aa2f7"/>
          <path d="M58 22 L40 52 L52 52 L46 78 L66 46 L54 46 Z" fill="none" stroke="#bb9af7" stroke-width="1.2"/>
        </svg>
      </div>
      <div class="actions"><div class="row"><button class="btn" onclick="exportSvg('ic3','boltcode-icon-3')">导出 SVG</button></div></div>
    </div>

    <!-- 4: 六边闪电（蜂巢协作 + bolt） -->
    <div class="card">
      <h3>4. 六边闪电</h3>
      <div class="desc">六边形（蜂巢=协作）内嵌闪电，双色拼接有层次。缩放到 favicon 仍清晰。</div>
      <div class="icon-box light">
        <svg width="100" height="100" viewBox="0 0 100 100" id="ic4">
          <defs><linearGradient id="g4a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7aa2f7"/><stop offset="1" stop-color="#565f89"/></linearGradient></defs>
          <!-- hexagon two-tone split by lightning -->
          <path d="M50 8 L88 30 L88 70 L50 92 L12 70 L12 30 Z" fill="url(#g4a)"/>
          <!-- lightning as the split, lighter half -->
          <path d="M50 8 L88 30 L88 70 L50 92 L12 70 L12 30 Z" fill="#bb9af7" opacity="0.25"/>
          <path d="M56 20 L40 48 L52 48 L44 80 L70 44 L54 44 Z" fill="#fff"/>
          <path d="M56 20 L40 48 L52 48 L44 80 L70 44 L54 44 Z" fill="none" stroke="#e0af68" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="actions"><div class="row"><button class="btn" onclick="exportSvg('ic4','boltcode-icon-4')">导出 SVG</button></div></div>
    </div>

  </div>

<script>
function exportSvg(id, name) {
  const svg = document.getElementById(id);
  const clone = svg.cloneNode(true);
  clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
  const data = new XMLSerializer().serializeToString(clone);
  const blob = new Blob([data], {type:'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name + '.svg'; a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
